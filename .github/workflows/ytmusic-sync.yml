# Daily YouTube Music history sync for the song leaderboard (music.html).
#
# Runs scripts/ytmusic/sync_history.py, which reads history with ytmusicapi and
# posts the new plays to the Cloudflare worker's D1 database. Secrets:
#   YTMUSIC_AUTH      auth JSON from scripts/ytmusic/setup_auth.py
#   MUSIC_SYNC_TOKEN  same value as the worker secret of that name
# get_history() only returns the last ~200 songs, so a daily cadence keeps the
# window comfortably ahead of how much is played between runs.
name: YouTube Music sync

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytmusic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ytmusic/requirements.txt
      - name: Install ytmusicapi
        run: pip install -r scripts/ytmusic/requirements.txt
      - name: Check the history diffing
        run: python -m unittest scripts/ytmusic/test_sync_history.py
      - name: Sync history
        env:
          YTMUSIC_AUTH: ${{ secrets.YTMUSIC_AUTH }}
          MUSIC_SYNC_TOKEN: ${{ secrets.MUSIC_SYNC_TOKEN }}
        run: python scripts/ytmusic/sync_history.py

  # A separate job, so only it holds issues: write; the sync job (which runs
  # the pip-installed ytmusicapi next to the secrets) keeps a read-only token.
  # One open issue at a time: a new failure adds a comment to it.
  report-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="YouTube Music sync failing"
          body="The YouTube Music sync failed: $RUN_URL

          The usual cause is an expired login in the YTMUSIC_AUTH secret (see scripts/ytmusic/setup_auth.py). get_history() returns only the last ~200 songs, so plays are lost while the sync stays broken. Close this issue after a run succeeds."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
