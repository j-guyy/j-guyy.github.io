# Daily YouTube Music history sync for the song leaderboard (music.html).
#
# Runs scripts/ytmusic/sync_history.py with the YTMUSIC_AUTH secret (the auth
# JSON from scripts/ytmusic/setup_auth.py) and commits data/music/history.db
# back to main when new plays were found; that push redeploys GitHub Pages.
# get_history() only returns the last ~200 songs, so a daily cadence keeps the
# window comfortably ahead of how much is played between runs.
name: YouTube Music sync

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytmusic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ytmusic/requirements.txt
      - name: Install ytmusicapi
        run: pip install -r scripts/ytmusic/requirements.txt
      - name: Check the history diffing
        run: python -m unittest scripts/ytmusic/test_sync_history.py
      - name: Sync history
        env:
          YTMUSIC_AUTH: ${{ secrets.YTMUSIC_AUTH }}
        run: python scripts/ytmusic/sync_history.py
      - name: Commit the database
        run: |
          if [ -z "$(git status --porcelain -- data/music/history.db)" ]; then
            echo "No new plays."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/music/history.db
          git commit -m "Music: sync YouTube Music history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
