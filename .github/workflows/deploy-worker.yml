# Deploys the Cloudflare Worker (worker.js) automatically.
#
# - Push to main touching worker.js / wrangler.toml: deploy.
# - Pull request touching worker.js / wrangler.toml: validate only (syntax check
#   + `wrangler deploy --dry-run`); no secrets are used and nothing is deployed.
# - Manual run (workflow_dispatch): deploys, but only from main.
#
# One-time setup: repository secrets CLOUDFLARE_API_TOKEN (token from the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. See CLAUDE.md.
# The Worker's own secrets (CLIENT_ID, CLIENT_SECRET, TRAVEL_PASSWORD) stay in
# Cloudflare and are untouched by a deploy.
name: Deploy Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Worker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check worker.js
      - name: Wrangler dry run
        run: npx --yes wrangler@4.20.0 deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"

  deploy:
    name: Deploy Worker
    # Never for pull requests (including forks) or branches other than main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy with placeholder KV ids
        run: |
          if grep -q 'REPLACE_WITH' wrangler.toml; then
            echo "::error file=wrangler.toml::wrangler.toml still has REPLACE_WITH_* placeholders; deploying would break the KV bindings."
            exit 1
          fi
      - name: Syntax check
        run: node --check worker.js
      - uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.20.0'
          command: deploy
