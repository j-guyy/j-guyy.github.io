# Builds the sideloadable Android APK for the Strava dashboard app.
#
# The app is a Capacitor remote shell: its WebView loads https://j-guyy.github.io/app/
# live, so ordinary site pushes update the app with NO rebuild. This workflow only
# needs to run when the native shell itself changes (android/, capacitor config,
# dependencies) — hence the path filter — or on demand via workflow_dispatch.
#
# The debug build is signed with a keystore generated fresh each run, so Android
# treats APKs from different runs as different signers: uninstall the old app
# before installing a newer APK. If that gets annoying, switch to assembleRelease
# with a persistent self-signed keystore stored in repo secrets.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest # Android SDK preinstalled, ANDROID_HOME set
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Checks gradle-wrapper.jar against the checksums Gradle publishes.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jg-strava-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
