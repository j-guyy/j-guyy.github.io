<body class="page">
    <div class="parallax-background"></div>
    <div class="parallax-overlay"></div>

    <nav-bar></nav-bar>

    <div class="content">
        <div class="hero">
            <h1>Peaks</h1>
        </div>

        <nav class="view-switch" aria-label="Choose view">
            <a href="#tables" class="view-switch-option" data-view="tables" aria-current="page">Tables</a>
            <a href="#map" class="view-switch-option" data-view="map">Map</a>
        </nav>

        <div class="section">
            <h2>Progress Report</h2>
            <div class="cross-nav">
                <a href="trip-reports/adirondack-46ers.html" class="cross-nav-link">ADK 46ers trip report →</a>
                <a href="trip-reports/colorado-14ers.html" class="cross-nav-link">CO 14ers trip report →</a>
                <a href="trip-reports/british-isles-high-five.html" class="cross-nav-link">British Isles High Five →</a>
                <a href="strava.html#mountain" class="cross-nav-link">Mountain Hunter →</a>
            </div>
            <div id="travel-summary"><p class="dash-loading dash-loading--peaks" role="status">Loading…</p></div>
            <div class="table-controls">
                <select id="table-selector" aria-label="Table to show">
                    <option value="adk46ers">Adirondack 46ers</option>
                    <option value="northeast115">Northeast 115</option>
                    <option value="catskill3500">Catskill 3500</option>
                    <option value="colorado14ers">Colorado 14ers</option>
                    <option value="highpoints">US State High Points</option>
                    <option value="britishIsles">British Isles High Five</option>
                    <option value="countryHighpoints">Country High Points</option>
                </select>
                <button id="export-csv-btn" class="table-action-btn" data-owner-only hidden>Export CSV</button>
                <button id="edit-mode-btn" class="table-action-btn" data-owner-only hidden>Edit Mode</button>
                <button id="owner-login-btn" class="table-action-btn owner-lock" title="Owner login" aria-label="Owner login">&#x1F512;</button>
            </div>
            <p id="peaks-source" class="peaks-source" hidden></p>
            <!-- Tables | Map (js/view-switch.js): both follow the list picked above. -->
            <div id="tables-view">
                <div id="travel-table-container"><p class="dash-loading" role="status">Loading…</p></div>
                <div id="strava-comparison" class="peaks-compare"></div>
            </div>
            <!-- Leaflet loads the first time the Map view is opened. -->
            <div id="map-view" hidden>
                <div id="peaks-map-legend" class="peaks-map-legend" aria-live="polite"></div>
                <div id="peaks-map" class="peaks-map"></div>
            </div>
        </div>
    </div>
