<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d0b">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/connect/icon-192.png">
    <title>Song Leaderboard — Justin Guyette</title>
    <meta name="description" content="Most-played songs from YouTube Music listening history.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/base.css?v=20261110e">
    <link rel="stylesheet" href="css/layout.css?v=20261110e">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css?v=20261110e">
</head>

<body class="page">
    <div class="parallax-background"></div>
    <div class="parallax-overlay"></div>

    <nav-bar></nav-bar>

    <div class="content">
        <div class="hero">
            <h1>Song Leaderboard</h1>
        </div>

        <div class="section">
            <h2>Most Played</h2>
            <div class="table-controls">
                <button id="music-import-btn" class="table-action-btn" data-owner-only hidden
                        title="Backfill play history from a Google Takeout watch-history.json">Import Takeout</button>
                <input id="music-import-file" type="file" accept=".json,application/json" hidden>
                <button id="owner-login-btn" class="table-action-btn owner-lock" title="Owner login" aria-label="Owner login">&#x1F512;</button>
            </div>
            <p id="music-status" role="status">Loading…</p>
            <div class="table-scroll-wrapper">
                <table class="travel-table" id="music-leaderboard" hidden>
                    <thead>
                        <tr><th>#</th><th>Song</th><th>Artist</th><th>Plays</th><th>Last played</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/travel-api.js"></script>
    <script src="js/music.js"></script>
    <script src="js/navbar-component.js"></script>
</body>

</html>
