<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Leaderboard — Justin Guyette</title>
    <meta name="description" content="Most-played songs from YouTube Music listening history.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page">
    <div class="parallax-background"></div>
    <div class="parallax-overlay"></div>

    <nav-bar></nav-bar>

    <div class="content">
        <div class="hero">
            <h1>Song Leaderboard</h1>
        </div>

        <div class="section">
            <h2>Most Played</h2>
            <p id="music-status">Loading…</p>
            <div class="table-scroll-wrapper">
                <table class="travel-table" id="music-leaderboard" hidden>
                    <thead>
                        <tr><th>#</th><th>Song</th><th>Artist</th><th>Plays</th><th>Last played</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="js/music.js"></script>
    <script src="js/navbar-component.js"></script>
</body>

</html>
