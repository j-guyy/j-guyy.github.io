<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Travel Map</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/map-controls.css">
    <link rel="stylesheet" href="css/world-map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.css" />
    <link href='https://unpkg.com/leaflet.fullscreen@5.3.3/dist/Control.FullScreen.css'
        rel='stylesheet' />
</head>

<body class="page">
    <div class="parallax-background"></div>
    <div class="parallax-overlay"></div>

    <nav-bar></nav-bar>

    <div class="content">
        <div class="hero">
            <h1>World Travel Map</h1>
        </div>

        <nav class="view-switch" aria-label="Choose view">
            <a href="world-dashboard.html" class="view-switch-option">Tables</a>
            <a href="world-map.html" class="view-switch-option" aria-current="page">Map</a>
        </nav>

        <div class="section">
            <div id="travel-summary"></div>
        </div>

        <div class="section">
            <h2>Global Adventures</h2>
            <p class="map-description">Every country I've visited, the places I've pinned, and every route I've recorded on Strava</p>
            <div class="map-view-toggle">
                <div class="view-mode-selector" role="group" aria-label="Map view">
                    <button class="view-mode-btn active" data-mode="countries" aria-pressed="true">Countries</button>
                    <button class="view-mode-btn" data-mode="footprint" aria-pressed="false">Footprint</button>
                    <button class="view-mode-btn" data-mode="fog" aria-pressed="false">Fog of War</button>
                </div>
                <div class="radius-control" id="radius-control" hidden>
                    <label for="radius-slider">Place radius: <span id="radius-value">100</span> km</label>
                    <input type="range" id="radius-slider" min="10" max="500" value="100" step="10">
                </div>
                <div class="radius-control" id="route-radius-control" hidden>
                    <label for="route-radius-slider">Route radius: <span id="route-radius-value">50</span> km</label>
                    <input type="range" id="route-radius-slider" min="5" max="300" value="50" step="5">
                </div>
            </div>
            <div class="wm-layer-chips" id="wm-layer-chips" role="group" aria-label="Map layers"></div>
            <div class="map-legend-container wm-map-wrap">
                <div class="map-container wm-map-container">
                    <div id="world-map"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js"></script>
    <script src='https://unpkg.com/leaflet.fullscreen@5.3.3/dist/Control.FullScreen.umd.js'></script>
    <script src="js/map-controls.js"></script>
    <script src="js/travel-api.js"></script>
    <script src="js/rest-countries.js"></script>
    <script src="js/world-map.js"></script>
    <script src="js/navbar-component.js"></script>
</body>

</html>
