<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0d0b">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/connect/icon-192.png">
    <title>Training Plan Builder — Justin Guyette</title>
    <link rel="stylesheet" href="css/base.css?v=20261110e">
    <link rel="stylesheet" href="css/layout.css?v=20261110e">
    <link rel="stylesheet" href="css/training-plan.css?v=20261110d">
    <link rel="stylesheet" href="css/responsive.css?v=20261110e">
    <meta name="description" content="Build a week-by-week endurance training plan for running, cycling and triathlon races.">
    <link rel="canonical" href="https://j-guyy.github.io/training-plan.html">
</head>

<body class="show-tools">
    <nav-bar></nav-bar>

    <div class="parallax-background"></div>
    <div class="parallax-overlay"></div>

    <div class="content">
        <div class="hero">
            <h1>Training Plan Builder</h1>
            <h2>Build your weekly training schedule</h2>
        </div>

        <div class="section">
            <div class="controls">
                <button id="addWeekBtn" class="primary-btn">+ Add Week</button>
                <button id="importBtn" class="secondary-btn">Import from Excel</button>
                <button id="exportBtn" class="secondary-btn">Export to Excel</button>
                <div class="start-date-control">
                    <label for="startDateInput">Start Date:</label>
                    <input type="date" id="startDateInput" class="date-input">
                </div>
            </div>
            <input type="file" id="fileInput" accept=".xlsx" style="display: none;">

            <div id="weeksContainer"></div>
            <!-- Feedback line (js/training-plan.js notify()): copy/paste, import, restore -->
            <p id="planStatus" class="plan-status" role="status" aria-live="polite"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js" integrity="sha384-P7KKlGD3Ng66Ds7oTliLzTnol6DbK+k7PafNYXIBDQ4b5eFWtmqctplDVOxslglR" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" integrity="sha384-PlRSzpewlarQuj5alIadXwjNUX+2eNMKwr0f07ShWYLy8B6TjEbm7ZlcN/ScSbwy" crossorigin="anonymous"></script>
    <script src="js/navbar-component.js"></script>
    <script src="js/training-plan.js?v=20261110d"></script>
</body>

</html>
