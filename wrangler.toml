# Cloudflare Worker config for the Strava/travel API (worker.js).
#
# A `wrangler deploy` REPLACES the Worker's bindings, triggers and variables with
# what is listed here, so this file must mirror everything the dashboard shows
# (Workers & Pages -> strava-worker -> Settings). Anything missing gets removed.
#
# Secrets (CLIENT_ID, CLIENT_SECRET, TRAVEL_PASSWORD) live in Cloudflare, are NOT
# listed here, and are preserved across deploys. Never put secret values in this repo.

name = "strava-worker"
main = "worker.js"
compatibility_date = "2025-09-01"

# Namespace ids (from the dashboard's KV list). The deploy workflow refuses to run
# if a placeholder id is ever reintroduced.
[[kv_namespaces]]
binding = "STRAVA_DATA"
id = "a2e8d7f7069c4948a2f7e2f0bdddc208"

[[kv_namespaces]]
binding = "STRAVA_KV"
id = "1a5eee59c7b447489a07bed10f4798e0"

# Cron trigger (Settings -> Triggers). Cloudflare crons run in UTC; this is
# midnight UTC. Keep it identical to the dashboard's cron expression.
[triggers]
crons = ["0 0 * * *"]

# If the dashboard also shows routes, a custom domain or plain-text variables,
# add them here ([vars] / routes = [...]) before the first deploy.
