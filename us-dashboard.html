<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Travel — Justin Guyette</title>
    <meta name="description" content="Tracking US travel progress across high points, metropolitan areas, and national parks with interactive data tables.">
    <meta property="og:title" content="US Travel — Justin Guyette">
    <meta property="og:description" content="Tracking US travel progress across high points, metropolitan areas, and national parks with interactive data tables.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://j-guyy.github.io/us-dashboard.html">
    <meta property="og:image" content="https://j-guyy.github.io/images/background-portrait.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="US Travel — Justin Guyette">
    <meta name="twitter:description" content="Tracking US travel progress across high points, metropolitan areas, and national parks with interactive data tables.">
    <meta name="twitter:image" content="https://j-guyy.github.io/images/background-portrait.jpg">
    <link rel="stylesheet" href="css/base.css?v=20261022">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/map.css?v=20261022m">
    <link rel="stylesheet" href="css/dashboard.css?v=20261022m">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page">
    <div class="parallax-background"></div>
    <div class="parallax-overlay"></div>

    <nav-bar></nav-bar>

    <div class="content">
        <div class="hero">
            <h1>US Travel</h1>
        </div>

        <!-- Tables and Map are two views of this one page; js/dashboard.js
             flips between them (#map in the URL opens the map). -->
        <nav class="view-switch" aria-label="Choose view">
            <a href="#tables" class="view-switch-option" data-view="tables" aria-current="page">Tables</a>
            <a href="#map" class="view-switch-option" data-view="map">Map</a>
        </nav>

        <div class="section">
            <h2>Progress Report</h2>
            <div id="travel-summary"></div>
        </div>

        <div class="section" id="tables-view">
            <div class="table-controls">
                <select id="table-selector">
                    <option value="states">States</option>
                    <option value="highpoints">High Points</option>
                    <option value="capitals">Capitals</option>
                    <option value="metros">Metros</option>
                    <option value="parks">National Parks</option>
                </select>
                <button id="export-csv-btn" class="table-action-btn" data-owner-only hidden>Export CSV</button>
                <button id="edit-mode-btn" class="table-action-btn" data-owner-only hidden>Edit Mode</button>
                <button id="owner-login-btn" class="table-action-btn owner-lock" title="Owner login" aria-label="Owner login">&#x1F512;</button>
            </div>
            <div id="travel-table-container"></div>
        </div>

        <!-- Built by js/map.js the first time the Map view is opened. -->
        <div class="section" id="map-view" hidden>
            <h2>Interactive Map</h2>
            <p class="map-description">Map of my current progress on all metros, high points, state capitals, and national parks</p>
            <div class="map-legend-container">
                <div class="map-container">
                    <div id="combined-map"></div>
                </div>
                <div id="map-legend"></div>
            </div>
            <div class="map-controls">
                <button id="toggle-metros">Hide Top 100 Metros</button>
                <button id="toggle-additional-metros">Hide Additional Metros</button>
                <button id="toggle-highpoints">Hide High Points</button>
                <button id="toggle-capitals">Hide Capitals</button>
                <button id="toggle-parks">Hide National Parks</button>
            </div>
        </div>
    </div>

    <script src="js/travel-api.js?v=20261022m"></script>
    <script src="js/view-switch.js?v=20261022"></script>
    <script src="js/map.js?v=20261022m"></script>
    <script src="js/dashboard.js?v=20261022m"></script>
    <script src="js/navbar-component.js?v=20261022b"></script>
</body>

</html>
